name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: weather_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Prepare Test Database
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE weather_test;"

      - name: Run Alembic Migrations on Dev Database
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/weather_dev
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/weather_test
          JWT_SECRET: ci_throwaway_jwt_secret_must_be_at_least_32_characters_long!
          IP_HASH_SECRET: ci_throwaway_ip_hash_secret_at_least_16_chars!
        run: alembic upgrade head

      - name: Run Pytest with Coverage
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/weather_dev
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/weather_test
          JWT_SECRET: ci_throwaway_jwt_secret_must_be_at_least_32_characters_long!
          IP_HASH_SECRET: ci_throwaway_ip_hash_secret_at_least_16_chars!
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14
